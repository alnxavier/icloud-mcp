name: Mail-only validation

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the mail-only Worker after validation
        type: boolean
        default: false
        required: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mail-only-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run scan
      - run: npm test -- test/mail-only-pilot.test.ts test/mail-tools.test.ts test/authorize-redirect-allowlist.test.ts test/authorize-login.test.ts test/login-page.test.ts test/auth-ordering.test.ts test/compose.test.ts test/append.test.ts test/read-path-wire.test.ts test/cross-user.test.ts test/password-pause.test.ts test/instructions.test.ts test/triage.test.ts test/move.test.ts test/confirm.test.ts
      - name: Verify the mail-only deployment bundle without publishing
        run: |
          cp wrangler.mail-only.jsonc wrangler.jsonc
          npm run gen:hostname
          npx wrangler deploy --dry-run --outdir /tmp/icloud-mcp-build
      - name: Ensure the private confirmation signing key exists
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { randomBytes } from 'node:crypto';
          const options = { encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe'] };
          try {
            const metadata = JSON.parse(execFileSync('npx', ['wrangler', 'secret', 'list', '--format', 'json'], options));
            if (!metadata.some(secret => secret.name === 'CONFIRM_SECRET')) {
              execFileSync('npx', ['wrangler', 'secret', 'put', 'CONFIRM_SECRET'], {
                ...options, input: randomBytes(32).toString('hex') + '\n',
              });
            }
            console.log('Private confirmation signing key is configured.');
          } catch {
            console.error('Could not configure the confirmation signing key; deployment stopped.');
            process.exit(1);
          }
          NODE
      - name: Publish the authorized mail-only Worker
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy
